<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Command Centre · IWDemy & Tjitra</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Carlito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;font-family:'Carlito','Calibri',Arial,sans-serif;background:#F7F7F5}
:root{
  --blue:#005287;--mustard:#FCB528;--mustard-d:#8A6200;--mustard-s:rgba(252,181,40,.12);
  --green:#1B8040;--t1:rgba(14,14,14,.92);--t2:rgba(30,28,24,.68);--t3:rgba(30,28,24,.45);
  --border:rgba(30,28,24,.09);--sh:0 1px 3px rgba(20,20,18,.06),0 4px 12px rgba(20,20,18,.05);
  --fd:'Montserrat','Arial Black',Arial,sans-serif;
  --nav-h:54px;
}

/* ── NAV SHELL ────────────────────────────────────────── */
.shell-nav{
  position:fixed;top:0;left:0;right:0;z-index:500;
  height:var(--nav-h);
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:0;padding:0 20px;
  box-shadow:var(--sh);
}
.nav-logos{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-logo-img{height:26px;width:auto;object-fit:contain;display:block}
.nav-logo-div{width:1px;height:18px;background:var(--border);flex-shrink:0}
.nav-divider{width:1px;height:28px;background:var(--border);margin:0 14px;flex-shrink:0}

/* TABS */
.nav-tabs{display:flex;gap:3px;flex:1;justify-content:center}
.tab-btn{
  font-family:var(--fd);font-size:11px;font-weight:700;letter-spacing:.03em;
  padding:7px 18px;border-radius:8px;border:none;cursor:pointer;
  color:var(--t3);background:transparent;transition:all .15s;
  display:flex;align-items:center;gap:6px;
}
.tab-btn:hover{color:var(--blue);background:rgba(0,82,135,.06)}
.tab-btn.active{color:var(--blue);background:var(--mustard);box-shadow:0 1px 6px rgba(252,181,40,.32)}
.tab-icon{font-size:13px}

/* RIGHT SIDE */
.nav-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.nav-date{font-size:11px;color:var(--t3);font-weight:600;padding:4px 10px;background:rgba(30,28,24,.06);border-radius:6px}
.btn-notion{
  display:flex;align-items:center;gap:6px;
  font-family:var(--fd);font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:6px 13px;border-radius:7px;border:1.5px solid rgba(0,82,135,.18);
  background:rgba(0,82,135,.05);color:var(--blue);
  text-decoration:none;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn-notion:hover{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-notion svg{width:13px;height:13px;flex-shrink:0}

/* ── IFRAME CONTAINER ────────────────────────────────── */
.frame-wrap{
  position:fixed;
  top:var(--nav-h);left:0;right:0;bottom:0;
}
.dash-frame{
  width:100%;height:100%;
  border:none;display:none;
  background:#F7F7F5;
}
.dash-frame.active{display:block}

/* ── FOOTER BAR ──────────────────────────────────────── */
.shell-footer{
  position:fixed;bottom:0;left:0;right:0;z-index:500;
  height:32px;
  background:rgba(0,82,135,.96);
  backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;
}
.footer-left{font-size:10px;color:rgba(255,255,255,.55);letter-spacing:.5px;font-family:var(--fd);font-weight:600}
.footer-right{display:flex;align-items:center;gap:12px}
.footer-sync{font-size:10px;color:rgba(255,255,255,.45)}
.btn-gemini{
  display:flex;align-items:center;gap:5px;
  font-family:var(--fd);font-size:10px;font-weight:700;
  padding:4px 11px;border-radius:5px;
  background:rgba(252,181,40,.18);color:var(--mustard);
  text-decoration:none;transition:all .15s;border:1px solid rgba(252,181,40,.25);
  letter-spacing:.03em;
}
.btn-gemini:hover{background:var(--mustard);color:var(--blue)}
.btn-gemini svg{width:12px;height:12px}

/* FOOTER OFFSET on frames */
.frame-wrap{bottom:32px}

/* ── LOADING STATE ────────────────────────────────────── */
.frame-loader{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:#F7F7F5;font-size:13px;color:var(--t3);
  pointer-events:none;opacity:0;transition:opacity .3s;
}
.frame-loader.show{opacity:1}
</style>
</head>
<body>

<!-- ── SHELL NAV ─────────────────────────────────────────────── -->
<nav class="shell-nav">

  <div class="nav-logos">
    <img class="nav-logo-img" src="./logo-iwdemy.jpg" alt="IWDemy">
    <div class="nav-logo-div"></div>
    <img class="nav-logo-img" src="./logo-tjitra.jpg" alt="Tjitra">
  </div>

  <div class="nav-divider"></div>

  <div class="nav-tabs">
    <button class="tab-btn active" data-tab="personal">
      <span class="tab-icon">👤</span>Personal
    </button>
    <button class="tab-btn" data-tab="tim">
      <span class="tab-icon">👥</span>Tim
    </button>
    <button class="tab-btn" data-tab="overview">
      <span class="tab-icon">🗂</span>Overview
    </button>
  </div>

  <div class="nav-divider"></div>

  <div class="nav-right">
    <div class="nav-date" id="navDate"></div>
    <a class="btn-notion" href="https://www.notion.so/a8cadc66cb544be68c896feaba03d85b" target="_blank" title="Buka Notion Tasks">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 9h6M9 12h6M9 15h4"/>
      </svg>
      Notion
    </a>
  </div>
</nav>

<!-- ── IFRAME FRAMES ─────────────────────────────────────────── -->
<div class="frame-wrap">
  <iframe id="f-personal" class="dash-frame active"
    src="./dashboard-personal--v1.html?embed=1"
    title="Personal Command Centre"></iframe>
  <iframe id="f-tim" class="dash-frame"
    src=""
    data-src="./dashboard-tim--v1.html?embed=1"
    title="Dashboard Tim"></iframe>
  <iframe id="f-overview" class="dash-frame"
    src=""
    data-src="./dashboard-overview--v1.html?embed=1"
    title="Overview"></iframe>
</div>

<!-- ── FOOTER ────────────────────────────────────────────────── -->
<footer class="shell-footer">
  <div class="footer-left">IWDemy · Tjitra &amp; Associates · Command Centre</div>
  <div class="footer-right">
    <span class="footer-sync" id="footerSync"></span>
    <a class="btn-gemini" href="https://gemini.google.com" target="_blank" title="Buka Gemini AI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
      Gemini
    </a>
  </div>
</footer>

<script>
// ── DATE BADGE ──────────────────────────────────────────────────
const nd=new Date();
document.getElementById('navDate').textContent=nd.toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short',year:'numeric'});

// Footer sync time (pulled from personal iframe after load)
document.getElementById('f-personal').addEventListener('load',function(){
  try{
    const iDoc=this.contentDocument||this.contentWindow.document;
    const syncBar=iDoc.getElementById('syncBar');
    if(syncBar&&syncBar.textContent){
      document.getElementById('footerSync').textContent=syncBar.textContent.trim();
    }
  }catch(e){}
});

// ── TAB SWITCHING ───────────────────────────────────────────────
const tabs=document.querySelectorAll('.tab-btn');
const frames=document.querySelectorAll('.dash-frame');

tabs.forEach(function(btn){
  btn.addEventListener('click',function(){
    const key=btn.dataset.tab;

    // Active tab styling
    tabs.forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');

    // Show/hide frames; lazy-load on first switch
    frames.forEach(function(f){
      const isTarget=f.id==='f-'+key;
      f.classList.toggle('active',isTarget);
      if(isTarget&&!f.src&&f.dataset.src){
        f.src=f.dataset.src;
      }
    });

    // Persist active tab in sessionStorage
    sessionStorage.setItem('cc-tab',key);
  });
});

// Restore last active tab
(function(){
  const saved=sessionStorage.getItem('cc-tab');
  if(saved&&saved!=='personal'){
    const btn=document.querySelector('[data-tab="'+saved+'"]');
    if(btn) btn.click();
  }
})();
</script>

</body>
</html>
