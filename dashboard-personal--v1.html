<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Tjitra & Associates">
<meta name="description" content="Personal Command Centre — Dashboard individual IWDemy & Tjitra">
<title>Command Centre · IWDemy</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Carlito:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F7F5;--card:#FFFFFF;
  --mustard:#FCB528;--mustard-d:#8A6200;--mustard-s:rgba(252,181,40,.10);
  --orange:#D06A00;--orange-s:rgba(208,106,0,.08);
  --green:#1B8040;--green-s:rgba(27,128,64,.08);
  --red:#C0392B;--red-s:rgba(192,57,43,.10);
  --maroon:#660000;
  --blue:#005287;--blue-s:rgba(0,82,135,.08);
  --t1:rgba(14,14,14,.92);--t2:rgba(30,28,24,.68);--t3:rgba(30,28,24,.50);
  --border:rgba(30,28,24,.09);--r:10px;
  --sh:0 1px 3px rgba(20,20,18,.04),0 4px 12px rgba(20,20,18,.04);
  --sh2:0 2px 8px rgba(20,20,18,.06),0 10px 28px rgba(20,20,18,.06);
  --fd:'Montserrat','Arial Black',Arial,sans-serif;
  --fb:'Carlito','Calibri',Arial,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}html{scroll-behavior:smooth}
body{font-family:var(--fb);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased;min-height:100vh;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px;position:relative;z-index:1}
a{color:inherit;text-decoration:none}

/* BACKGROUND BLOBS */
.bg-blobs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-blob{position:absolute;border-radius:50%;filter:blur(100px)}
.bg-blob:nth-child(1){width:560px;height:560px;top:-180px;left:-120px;background:rgba(0,82,135,.05)}
.bg-blob:nth-child(2){width:480px;height:480px;top:30%;right:-100px;background:rgba(252,181,40,.04)}
.bg-blob:nth-child(3){width:420px;height:420px;bottom:-120px;left:50%;transform:translateX(-50%);background:rgba(100,100,100,.04)}

/* TICKER */
.ticker-wrap{background:var(--blue);height:36px;display:flex;align-items:center;overflow:hidden}
.ticker-label{flex-shrink:0;background:var(--mustard);color:var(--blue);font-family:var(--fd);font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:0 16px;height:100%;display:flex;align-items:center;white-space:nowrap}
.ticker-msg{flex:1;padding:0 24px;position:relative;height:100%;overflow:hidden}
.ticker-text{font-size:11px;color:rgba(255,255,255,.82);position:absolute;top:50%;left:24px;right:24px;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s ease,transform .6s ease}
.ticker-text.visible{opacity:1;transform:translateY(-50%) translateX(0)}
.ticker-text.exit{opacity:0;transform:translateY(-50%) translateX(-8px)}
.ticker-text.enter{opacity:0;transform:translateY(-50%) translateX(8px)}

/* NAV */
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);border-bottom:1px solid var(--border);height:58px;display:flex;align-items:center;padding:0 24px;justify-content:space-between}
.nav-brand{display:flex;align-items:center;gap:12px}
.nav-logos{display:flex;align-items:center;gap:10px}
.nav-logo-img{height:28px;width:auto;object-fit:contain;display:block}
.nav-logo-divider{width:1px;height:20px;background:var(--border);flex-shrink:0}
.nav-tabs{display:flex;gap:2px}
.nav-tab{font-family:var(--fd);font-size:11px;font-weight:700;color:var(--t3);padding:6px 13px;border-radius:7px;text-decoration:none;transition:all .15s}
.nav-tab:hover{color:var(--blue);background:var(--blue-s)}
.nav-tab.active{color:var(--blue);background:var(--mustard);box-shadow:0 1px 4px rgba(252,181,40,.30)}
.nav-right{display:flex;align-items:center;gap:8px}
.nav-date{font-size:11px;color:var(--t3);padding:5px 12px;border-radius:7px;background:rgba(30,28,24,.06);font-weight:600}

/* HERO */
.hero-eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--mustard-s);border:1px solid rgba(252,181,40,.22);padding:3px 11px;border-radius:999px;font-family:var(--fd);font-size:10px;font-weight:700;color:var(--blue);letter-spacing:.07em;text-transform:uppercase;margin-bottom:8px}
.eyebrow-dot{width:5px;height:5px;background:var(--mustard);border-radius:50%}

/* HEADER */
.hdr{padding:20px 0 0}
.hdr-name{font-family:var(--fd);font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-1px;color:var(--t1);line-height:1.15;margin-bottom:3px}
.hdr-name span{color:var(--mustard-d)}
.hdr-sub{font-size:11px;color:var(--t3);letter-spacing:.2px;margin-bottom:0}
.admin-hdr{padding:20px 0 0}
.admin-title{font-family:var(--fd);font-size:22px;font-weight:800;letter-spacing:-.8px;color:var(--t1);margin-bottom:2px}
.admin-sub{font-size:11px;color:var(--t3)}

/* STATS STRIP */
.stats-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:8px 0 16px;font-size:12px;color:var(--t2)}
.stats-strip strong{font-family:var(--fd);font-weight:800;font-size:15px;line-height:1;margin-right:1px}
.ss-ov strong{color:var(--red)}.ss-td strong{color:var(--orange)}.ss-do strong{color:var(--green)}
.ss-sep{color:var(--t3);font-size:10px;user-select:none}

/* COCKPIT */
.cockpit{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{display:flex;align-items:baseline;gap:5px;padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);box-shadow:var(--sh)}
.chip-num{font-family:var(--fd);font-size:18px;font-weight:800;letter-spacing:-.8px;line-height:1}
.chip-lbl{font-size:10px;color:var(--t3);letter-spacing:.3px}
.chip.c-ov .chip-num{color:var(--red)}
.chip.c-td .chip-num{color:var(--orange)}
.chip.c-do .chip-num{color:var(--green)}



/* TABS */
.person-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}
.tab-btn{display:flex;align-items:center;gap:7px;padding:8px 16px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-family:var(--fb);font-size:13px;font-weight:600;color:var(--t2);transition:all .18s;box-shadow:var(--sh)}
.tab-btn:hover{border-color:var(--mustard);color:var(--mustard-d)}
.tab-btn.active{background:var(--mustard);border-color:var(--mustard);color:#fff;box-shadow:0 3px 10px rgba(252,181,40,.30)}
.tab-av{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}
.tab-btn:not(.active) .tab-av{background:rgba(30,28,24,.08);color:var(--t2)}
.tab-ct{font-size:10px;background:rgba(255,255,255,.4);padding:1px 6px;border-radius:8px;font-weight:700}
.tab-btn:not(.active) .tab-ct{background:rgba(30,28,24,.07);color:var(--t3)}
.tab-dot{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0}
.person-view{display:none}.person-view.active{display:block}

/* ZONES */
.zone{margin-bottom:14px}
.zone-hdr{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.zdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.zone-overdue .zdot{background:var(--red)}
.zone-today .zdot{background:var(--orange)}
.zone-week .zdot{background:var(--blue)}
.zone-queue .zdot{background:rgba(30,28,24,.22)}
.zlbl{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--t3)}
.zone-overdue .zlbl{color:var(--red)}
.zone-today .zlbl{color:var(--orange)}
.zone-week .zlbl{color:var(--blue)}
.zct{font-size:10px;color:var(--t3);margin-left:3px}
.zempty{font-size:12px;color:var(--t3);font-style:italic;padding:6px 0}

/* TASK CARD */
.tc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:6px;position:relative;box-shadow:var(--sh);transition:box-shadow .18s;overflow:hidden}
.tc:hover{box-shadow:var(--sh2)}
.tc::before{content:'';position:absolute;top:0;left:0;right:0;height:2px}
.tc.p1::before{background:var(--orange)}
.tc.p2::before{background:var(--mustard)}
.tc.p3::before{background:rgba(30,28,24,.14)}
.tc.hold::before{background:rgba(30,28,24,.08)}
.tc-r1{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:7px}
.tc-name{font-family:var(--fd);font-size:13.5px;font-weight:700;letter-spacing:-.2px;line-height:1.3;flex:1;color:var(--t1)}
.tc-name a:hover{color:var(--mustard-d)}
.tc-cd{font-family:var(--fd);font-size:11px;font-weight:700;padding:3px 10px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.tc-cd.overdue{background:var(--red-s);color:var(--red);font-weight:700}
.tc-cd.overdue-warn{background:#fff0e6;color:#b85c00;font-weight:800}
.tc-cd.overdue-kritis{background:#fde8e8;color:#8b1a1a;font-weight:800;letter-spacing:.2px}
/* Overdue card — stronger visual treatment */
.zone-overdue .tc{background:#fff5f5;border-color:#f5c6c6;border-left:4px solid var(--red)}
.zone-overdue .tc::before{background:var(--red)!important}
.zone-overdue .zone-hdr{background:#fef2f2;border:1px solid #f5c6c6;border-radius:8px;padding:6px 12px;margin-bottom:12px}
.zone-overdue .zdot{width:10px;height:10px;animation:pulse-red 1.4s ease-in-out infinite}
.zone-overdue .zlbl{font-size:11px;letter-spacing:3px;color:var(--red);font-weight:800}
.zone-overdue .zct{color:var(--red);font-weight:700;font-size:11px;margin-left:2px}
@keyframes pulse-red{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.5)}50%{box-shadow:0 0 0 5px rgba(192,57,43,0)}}
.tc-cd.today{background:var(--orange-s);color:var(--orange)}
.tc-cd.tomorrow{background:var(--green-s);color:var(--green)}
.tc-cd.days{background:rgba(30,28,24,.06);color:var(--t2)}
.tc-cd.nodue{background:rgba(30,28,24,.04);color:var(--t3)}
.tc-tags{display:flex;gap:5px;flex-wrap:wrap}
.tag{font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:2px 8px;border-radius:4px}
.tag-p1{background:var(--orange-s);color:var(--orange)}
.tag-p2{background:var(--mustard-s);color:var(--mustard-d)}
.tag-p3{background:rgba(30,28,24,.06);color:var(--t3)}
.tag-hold{background:rgba(30,28,24,.05);color:var(--t3)}
.tag-doing{background:var(--green-s);color:var(--green)}
.tag-next{background:rgba(30,28,24,.06);color:var(--t2)}
.tag-waiting{background:rgba(30,28,24,.05);color:var(--t3)}
.tag-domain{background:rgba(102,0,0,.07);color:var(--maroon)}
.tag-ms{background:rgba(252,181,40,.15);color:var(--mustard-d)}
.tag-ov{background:var(--red-s);color:var(--red);font-weight:700}

/* SYNC BADGE */
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;color:var(--t3);padding:3px 10px;border-radius:999px;background:rgba(30,28,24,.05);border:1px solid var(--border);margin-bottom:14px}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}
.sync-badge span{font-weight:600;color:var(--t2)}

/* TIME BANNER */
@keyframes banner-pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(252,181,40,.0);opacity:1}
  50%{box-shadow:0 0 0 5px rgba(252,181,40,.18);opacity:.88}
}
@keyframes icon-bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.time-banner{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;border-radius:var(--r);border-left:3px solid;font-size:12px;color:var(--t2)}
.time-banner.banner-morning{background:rgba(252,181,40,.08);border-color:var(--mustard)}
.time-banner.banner-midday{background:rgba(0,82,135,.07);border-color:var(--blue)}
.time-banner.banner-wrap{background:rgba(208,106,0,.07);border-color:var(--orange)}
.time-banner.banner-review{background:rgba(27,128,64,.07);border-color:var(--green)}
.time-banner.pulse{animation:banner-pulse 1.4s ease-in-out infinite}
.time-banner.pulse .tb-icon{display:inline-block;animation:icon-bounce 1.4s ease-in-out infinite}
.tb-icon{font-size:15px;flex-shrink:0}
.tb-msg{line-height:1.4}

/* MY TODAY */
.myt-section{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:16px;box-shadow:var(--sh)}
.myt-label{font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--blue);margin-bottom:10px}
.myt-row{display:flex;align-items:center;gap:8px}
.myt-input{flex:1;border:none;border-bottom:2px solid var(--border);background:transparent;font-family:var(--fb);font-size:18px;font-weight:600;color:var(--t1);padding:4px 0;outline:none;transition:border-color .15s}
.myt-input:focus{border-color:var(--mustard)}
.myt-input::placeholder{color:var(--t3)}

/* SELESAI MINGGU INI */
.zone-selesai .zdot{background:var(--green)}
.zone-selesai .zlbl{color:var(--green)}
.zone-selesai>.zone-hdr{cursor:pointer;user-select:none}
.zone-selesai>.zone-hdr .chev{font-size:8px;color:var(--t3);margin-left:auto;display:inline-block;transition:transform .22s}
.zone-selesai.collapsed>.zone-hdr .chev{transform:rotate(-90deg)}
.selesai-body{overflow:hidden;transition:max-height .3s ease,opacity .2s ease;opacity:1}
.zone-selesai.collapsed .selesai-body{max-height:0!important;opacity:0;pointer-events:none}
.tc-done{background:rgba(27,128,64,.04);border:1px solid rgba(27,128,64,.14);border-radius:var(--r);padding:8px 14px;margin-bottom:5px;display:flex;align-items:center;gap:10px}
.tc-done-check{font-size:12px;flex-shrink:0}
.tc-done-name{font-size:12.5px;color:var(--t2);flex:1;line-height:1.35;text-decoration:none}
.tc-done-name:hover{color:var(--green)}
.tc-done-domain{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:4px;background:rgba(27,128,64,.10);color:var(--green);flex-shrink:0}
.selesai-person-hdr{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin:10px 0 6px;padding-left:2px}

/* VELOCITY CHART */
.vc-wrap{background:rgba(27,128,64,.04);border:1px solid rgba(27,128,64,.14);border-radius:var(--r);padding:10px 14px 8px;margin-bottom:12px}
.vc-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.vc-title{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green)}
.vc-total{font-family:var(--fd);font-size:14px;font-weight:800;color:var(--green)}
.vc-bars{display:flex;gap:5px;align-items:flex-end;height:44px}
.vc-col{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px;position:relative}
.vc-bar-wrap{height:28px;display:flex;align-items:flex-end;width:100%}
.vc-bar{width:100%;border-radius:2px 2px 0 0;min-height:2px;transition:height .35s ease}
.vc-bar.act{background:var(--green)}
.vc-bar.tod{background:var(--mustard)}
.vc-bar.emp{background:rgba(30,28,24,.09)}
.vc-lbl{font-size:8px;color:var(--t3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.vc-lbl.act{color:var(--green)}
.vc-lbl.tod{color:var(--mustard-d)}
.vc-ct{font-size:9px;font-weight:800;color:var(--green);height:11px;line-height:1;position:absolute;top:-14px;left:50%;transform:translateX(-50%)}

/* SYNC + FOOTER */
.sync-bar{text-align:center;font-size:11px;color:var(--t3);margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.ftr{text-align:center;margin-top:28px;padding-top:14px;border-top:1px solid var(--border)}
.ftr p{font-size:11px;color:var(--t3);font-style:italic;line-height:1.6}
.ftr span{display:block;font-size:9px;color:rgba(30,28,24,.46);letter-spacing:1px;text-transform:uppercase;margin-top:3px}

/* FOCUS LINK */
.focus-link{display:flex;align-items:center;gap:10px;margin-top:14px;padding:11px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r);text-decoration:none;color:var(--blue);font-family:var(--fb);font-size:13px;font-weight:600;box-shadow:var(--sh);transition:all .18s}
.focus-link:hover{border-color:var(--mustard);box-shadow:var(--sh2);transform:translateY(-1px)}
.focus-link svg{width:15px;height:15px;flex-shrink:0;stroke:var(--mustard);stroke-width:2}
.focus-link span{flex:1}
.focus-link-arr{font-size:14px;color:var(--t3)}

@media(max-width:540px){.cockpit{gap:6px}.chip{padding:5px 12px}}

/* ── NARRATIVE DIGEST ─────────────────────────────────────────── */
.digest{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;background:rgba(0,82,135,.05);border:1px solid rgba(0,82,135,.10);border-radius:var(--r);margin-top:10px;margin-bottom:4px}
.digest-icon{font-size:15px;line-height:1;flex-shrink:0;margin-top:1px}
.digest-text{font-size:12px;color:var(--t1);line-height:1.55}
.digest-text strong{color:var(--blue);font-weight:700}
.digest-text em{font-style:normal;color:var(--green);font-weight:600}

/* ── TOP PRIORITY CARD ───────────────────────────────────────── */
.top-pri{background:linear-gradient(135deg,rgba(0,82,135,.05) 0%,rgba(252,181,40,.06) 100%);border:1.5px solid rgba(0,82,135,.14);border-radius:var(--r);padding:13px 15px;margin-bottom:14px;position:relative}
.top-pri-eyebrow{font-size:9px;font-weight:700;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.top-pri-eyebrow::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--mustard);flex-shrink:0}
.top-pri-name{font-size:15px;font-weight:700;color:var(--t1);line-height:1.3;margin-bottom:8px}
.top-pri-name a{color:inherit;text-decoration:none}
.top-pri-name a:hover{color:var(--blue);text-decoration:underline}
.top-pri-tags{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top-pri-reason{font-size:10px;color:var(--t3);font-style:italic;margin-top:7px}

</style>
</head>

// ── HELPERS ────────────────────────────────────────────────────
const NOW=new Date();NOW.setHours(0,0,0,0);
function du(d){if(!d)return null;const x=new Date(d);x.setHours(0,0,0,0);return Math.ceil((x-NOW)/864e5);}
function cdInfo(df){
  if(df===null)return{cls:'nodue',txt:'—'};
  if(df<0){
    const abs=Math.abs(df);
    if(abs>7)  return{cls:'overdue-kritis',txt:'⚠ '+abs+'d telat'};
    if(abs>3)  return{cls:'overdue-warn',  txt:abs+'d telat'};
    return         {cls:'overdue',         txt:abs+'d telat'};
  }
  if(df===0)return{cls:'today',txt:'TODAY'};
  if(df===1)return{cls:'tomorrow',txt:'BESOK'};
  return{cls:'days',txt:df+'d lagi'};
}
function pTag(p){
  const lp=(p||'').toLowerCase();
  if(lp==='p1')return['P1','tag-p1'];
  if(lp==='p2')return['P2','tag-p2'];
  if(lp==='p3')return['P3','tag-p3'];
  return['Hold','tag-hold'];
}
function sTag(s){
  const ls=(s||'').toLowerCase();
  if(ls==='doing')return['● Doing','tag-doing'];
  if(ls==='next')return['○ Next','tag-next'];
  return['◌ Waiting','tag-waiting'];
}
function isMilestone(n){return(n||'').includes('🏁');}
function isDone(t){return(t.status||'').toLowerCase()==='done';}
function isActive(t){return !isDone(t);}
function isDoing(t){return(t.status||'').toLowerCase()==='doing';}
function getPersonTasks(key){return TASKS.filter(t=>t.assignee===key);}
function getZone(t){
  const d=du(t.due);
  if(d===null)return'queue';
  if(d<0)return'overdue';
  if(d===0)return'today';
  if(d<=7)return'week';
  return'queue';
}

const PORD={P1:0,P2:1,P3:2,Hold:3};
function tcHTML(t){
  const df=du(t.due);
  const cd=cdInfo(df);
  const[pL,pC]=pTag(t.priority);
  const[sL,sC]=sTag(t.status);
  const priCls=(t.priority||'').toLowerCase();
  const nameStr=t.url?`<a href="${t.url}" target="_blank">${t.name}</a>`:t.name;
  const ms=isMilestone(t.name)?`<span class="tag tag-ms">🏁 Milestone</span>`:'';
  const ovBadge=df!==null&&df<0?`<span class="tag tag-ov">OVERDUE</span>`:'';
  return `<div class="tc ${priCls}">
    <div class="tc-r1">
      <div class="tc-name">${nameStr}</div>
      <div class="tc-cd ${cd.cls}">${cd.txt}</div>
    </div>
    <div class="tc-tags">
      <span class="tag ${pC}">${pL}</span>
      <span class="tag ${sC}">${sL}</span>
      ${t.domain?`<span class="tag tag-domain">${t.domain}`+`</span>`:''}
      ${ms}${ovBadge}
    </div>
  </div>`;
}

    line2=`Mulai dari task hari ini: <strong>${n}</strong>.`;

    line2='Cek queue dan ambil satu task untuk mulai dikerjakan.';
  }
  return`<div class="digest"><span class="digest-icon">💡</span><div class="digest-text">${line1} ${line2}</div></div>`;
}

// ── TOP PRIORITY CARD ─────────────────────────────────────────────
function renderTopPriority(key){
  const tasks=getPersonTasks(key);
  const byDue=(a,b)=>{const da=du(a.due)??9999,db=du(b.due)??9999;return da-db;};
  const byPri=(a,b)=>(PORD[a.priority]??2)-(PORD[b.priority]??2);
  const isDoing=t=>(t.status||'').toLowerCase()==='doing';
  const msDoing=tasks.filter(t=>isActive(t)&&isMilestone(t.name)&&isDoing(t)).sort(byDue);
  const overdueP1=tasks.filter(t=>isActive(t)&&(du(t.due)??0)<0&&(t.priority||'')==='P1').sort(byDue);
  const todayP1=tasks.filter(t=>isActive(t)&&du(t.due)===0&&(t.priority||'')==='P1').sort(byPri);
  const doingTask=tasks.filter(t=>isActive(t)&&isDoing(t)).sort(byPri);
  const overdueAny=tasks.filter(t=>isActive(t)&&(du(t.due)??0)<0).sort(byDue);
  const todayAny=tasks.filter(t=>isActive(t)&&du(t.due)===0).sort(byPri);
  let top=null, reason='';
  if(msDoing.length){top=msDoing[0];reason='Milestone sedang dikerjakan';}
  else if(overdueP1.length){top=overdueP1[0];reason='Overdue & P1 — butuh perhatian segera';}
  else if(todayP1.length){top=todayP1[0];reason='P1 jatuh tempo hari ini';}
  else if(doingTask.length){top=doingTask[0];reason='Task yang sedang berjalan';}
  else if(overdueAny.length){top=overdueAny[0];reason='Task overdue — selesaikan segera';}
  else if(todayAny.length){top=todayAny[0];reason='Task hari ini';}
  if(!top) return '';
  const df=du(top.due);
  const cd=cdInfo(df);
  const[pL,pC]=pTag(top.priority);
  const[sL,sC]=sTag(top.status);
  const nameHtml=top.url?`<a href="${top.url}" target="_blank">${top.name.replace('🏁','').trim()}</a>`:top.name.replace('🏁','').trim();
  const msTag=isMilestone(top.name)?`<span class="tag tag-ms">🏁 Milestone</span>`:'';
  return`<div class="top-pri">
    <div class="top-pri-eyebrow">🎯 Satu Task Terpenting Sekarang</div>
    <div class="top-pri-name">${nameHtml}</div>
    <div class="top-pri-tags">
      <span class="tag ${pC}">${pL}</span>
      <span class="tag ${sC}">${sL}</span>
      ${top.domain?`<span class="tag tag-domain">${top.domain}</span>`:''}
      <div class="tc-cd ${cd.cls}">${cd.txt}</div>
      ${msTag}
    </div>
    <div class="top-pri-reason">${reason}</div>
  </div>`;
}

// ── TIME BANNER ────────────────────────────────────────────────────
function renderTimeBanner(){
  const now=new Date();
  const h=now.getHours();
  const m=now.getMinutes();
  const hm=h*60+m;
  const dow=now.getDay(); // 0=Sun,5=Fri
  // Target times: 08:00, 11:00, 13:00, 17:30 — window ±25 menit
  const W=25;
  const BELLS=[
    {t:8*60,   icon:'🌅',cls:'banner-morning',msg:'Waktunya mulai! Update Notion dan isi 3 prioritas hari ini.'},
    {t:11*60,  icon:'⏱', cls:'banner-midday', msg:'Sudah update progress task di Notion pagi ini?'},
    {t:13*60,  icon:'✅', cls:'banner-midday', msg:'Setelah makan siang — tandai task yang sudah selesai di Notion.'},
    {t:17*60+30,icon:'🔔',cls:'banner-wrap',  msg:'Hampir selesai! Cek overdue dan update status sebelum tutup hari.'},
  ];
  // Jumat sore override
  if(dow===5&&hm>=17*60+15&&hm<=18*60+30)
    return`<div class="time-banner banner-review pulse"><span class="tb-icon">📋</span><span class="tb-msg">Jumat sore — review <strong>Selesai Minggu Ini</strong> dan tandai selesai di Notion sebelum weekend.</span></div>`;
  for(const b of BELLS){
    if(hm>=b.t-W&&hm<=b.t+W)
      return`<div class="time-banner ${b.cls} pulse"><span class="tb-icon">${b.icon}</span><span class="tb-msg">${b.msg}</span></div>`;
  }
  return'';
}

function attachMyTodayListeners(){
  const form=document.querySelector('.myt-form');
  if(!form)return;
  const lsKey=form.dataset.lskey;
  form.querySelectorAll('.myt-input').forEach(inp=>{
    inp.addEventListener('input',()=>{
      const vals=[...form.querySelectorAll('.myt-input')].map(i=>i.value);

// ── URGENCY ZONES — untuk team members ────────────────────────────────────────
function renderZones(key){
  const tasks=getPersonTasks(key);
  const Z={overdue:[],today:[],week:[],queue:[]};
  tasks.forEach(t=>Z[getZone(t)].push(t));
  const byDue=(a,b)=>{const da=du(a.due)??9999,db=du(b.due)??9999;return da-db;};
  const byPri=(a,b)=>(PORD[a.priority]??2)-(PORD[b.priority]??2);
  const byMs=(a,b)=>(isMilestone(b.name)?1:0)-(isMilestone(a.name)?1:0);
  // Milestone naik ke atas tiap zona, lalu sort normal
  Z.overdue.sort((a,b)=>byMs(a,b)||byDue(a,b));
  Z.today.sort((a,b)=>byMs(a,b)||byPri(a,b));
  Z.week.sort((a,b)=>byMs(a,b)||byDue(a,b));
  Z.queue.sort((a,b)=>byMs(a,b)||byPri(a,b));
  const defs=[
    {k:'overdue',cls:'zone-overdue',lbl:'Overdue',show:Z.overdue.length>0},
    {k:'today',cls:'zone-today',lbl:'Hari Ini',show:true},
    {k:'week',cls:'zone-week',lbl:'Minggu Ini',show:true},
    {k:'queue',cls:'zone-queue',lbl:'Antrian',show:true},
  ];
  return defs.filter(z=>z.show).map(z=>`<div class="zone ${z.cls}">
    <div class="zone-hdr"><div class="zdot"></div><span class="zlbl">${z.lbl}</span><span class="zct">${Z[z.k].length}</span></div>
    ${Z[z.k].length===0?`<div class="zempty">Tidak ada task di zona ini.</div>`:Z[z.k].map(tcHTML).join('')}
  </div>`).join('');
}

// ── FOCUS SECTION — khusus Yanti (compact: top 6 task terpenting) ──────────────
function renderFocus(key){
  const tasks=getPersonTasks(key);
  const byDue=(a,b)=>{const da=du(a.due)??9999,db=du(b.due)??9999;return da-db;};
  const byPri=(a,b)=>(PORD[a.priority]??2)-(PORD[b.priority]??2);
  const isDoing=t=>(t.status||'').toLowerCase()==='doing';
  // Milestone Doing — selalu naik ke atas pool, apapun due date-nya
  const msDoing=tasks.filter(t=>isMilestone(t.name)&&isDoing(t)).sort(byDue);
  const overdue=tasks.filter(t=>{const d=du(t.due);return d!==null&&d<0;}).sort(byDue);
  const today=tasks.filter(t=>du(t.due)===0).sort(byPri);
  const weekP1=tasks.filter(t=>{const d=du(t.due);return d!==null&&d>0&&d<=7&&(t.priority||'').toLowerCase()==='p1';}).sort(byDue);
  const doing=tasks.filter(t=>isDoing(t)&&du(t.due)===null).sort(byPri);
  // Build priority pool: milestone+doing → overdue → today → this-week P1 → doing no-due
  const seen=new Set();
  const pool=[];
  [...msDoing,...overdue,...today,...weekP1,...doing].forEach(t=>{
    if(!seen.has(t.name)){seen.add(t.name);pool.push(t);}
  });
  const top=pool.slice(0,6);
  const totalActive=tasks.filter(t=>(t.priority||'').toLowerCase()!=='hold').length;
  const hdr=`<div class="zone-hdr">
    <div class="zdot" style="background:var(--mustard)"></div>
    <span class="zlbl">Fokus Hari Ini</span>
    <span class="zct">${top.length} terpenting · ${totalActive} aktif total</span>
  </div>`;
  const cards=top.length===0
    ?`<div class="zempty">Tidak ada task mendesak hari ini 🎉</div>`
    :top.map(tcHTML).join('');
  const moreLink=`<a href="./dashboard-hari-ini--v1.html" class="focus-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span>Lihat semua task tim di Hari Ini</span>
    <span class="focus-link-arr">›</span>
  </a>`;
  return`<div class="zone">${hdr}${cards}</div>${moreLink}`;
}

// ── STATS STRIP ────────────────────────────────────────────────────
function renderStatsStrip(tasks){
  const ov=tasks.filter(t=>{const d=du(t.due);return d!==null&&d<0;}).length;
  const td=tasks.filter(t=>du(t.due)===0).length;
  const do_=tasks.filter(t=>(t.status||'').toLowerCase()==='doing').length;
  const parts=[];
  if(ov>0) parts.push(`<span class="ss-ov"><strong>${ov}</strong> overdue</span><span class="ss-sep">·</span>`);
  parts.push(`<span class="ss-td"><strong>${td}</strong> hari ini</span>`);
  parts.push(`<span class="ss-sep">·</span><span class="ss-do"><strong>${do_}</strong> doing</span>`);
  parts.push(`<span class="ss-sep">·</span><span><strong>${tasks.length}</strong> total</span>`);
  return`<div class="stats-strip">${parts.join('')}</div>`;
}


// ── VELOCITY CHART ────────────────────────────────────────────────────
// ── VELOCITY CHART ────────────────────────────────────────────────────
const DAY_ABBR=['Mg','Sn','Sl','Rb','Km','Jm','Sb'];
const PERSON_LABEL={yanti:'Yanti',juli:'Juli',meliana:'Meliana',anita:'Anita',stephen:'Stephen'};

function renderVelocity(src, title){
  const todayD=new Date();todayD.setHours(0,0,0,0);
  const cols=[];
  for(let i=6;i>=0;i--){
    const d=new Date(todayD);d.setDate(d.getDate()-i);
    const iso=d.toISOString().slice(0,10);
    cols.push({iso,lbl:DAY_ABBR[d.getDay()],isToday:i===0,count:src.filter(t=>t.due===iso).length});
  }
  const max=Math.max(...cols.map(c=>c.count),1);
  const total=cols.reduce((s,c)=>s+c.count,0);
  if(!total) return'';
  const bars=cols.map(c=>{
    const h=c.count>0?Math.max(Math.round((c.count/max)*26),4):2;
    const bc=c.isToday?'tod':c.count>0?'act':'emp';
    const lc=c.isToday?'tod':c.count>0?'act':'';
    return`<div class="vc-col">
      <div class="vc-bar-wrap"><div class="vc-bar ${bc}" style="height:${h}px"></div></div>
      ${c.count>0?`<div class="vc-ct">${c.count}</div>`:''}
      <div class="vc-lbl ${lc}">${c.lbl}</div>
    </div>`;
  }).join('');
  return`<div class="vc-wrap">
    <div class="vc-head">
      <span class="vc-title">${title}</span>
      <span class="vc-total">${total} selesai</span>
    </div>
    <div class="vc-bars">${bars}</div>
  </div>`;
}

// ── SELESAI MINGGU INI ────────────────────────────────────────────────────
const PERSON_ORDER=['yanti','juli','meliana','anita','stephen'];
function renderSelesai(key){
  const isLeader=key==='yanti';
  const done=isLeader?DONE_TASKS:DONE_TASKS.filter(t=>t.assignee===key);
  if(!done.length) return'';
  const vcTitle=isLeader?'Output Tim · 7 Hari':'Selesai · 7 Hari';
  const vc=isLeader?renderVelocity(done,vcTitle):'';
  let rows='';
  if(isLeader){
    // Group by person, ordered
    PERSON_ORDER.forEach(k=>{
      const ptasks=done.filter(t=>t.assignee===k);
      if(!ptasks.length) return;
      rows+=`<div class="selesai-person-hdr">${PERSON_LABEL[k]||k}</div>`;
      rows+=ptasks.map(t=>`<div class="tc-done">
        <span class="tc-done-check">✅</span>
        <a class="tc-done-name" href="${t.url}" target="_blank">${t.name}</a>
        <span class="tc-done-domain">${t.domain}</span>
      </div>`).join('');
    });
  } else {
    rows=done.map(t=>`<div class="tc-done">
      <span class="tc-done-check">✅</span>
      <a class="tc-done-name" href="${t.url}" target="_blank">${t.name}</a>
      <span class="tc-done-domain">${t.domain}</span>
    </div>`).join('');
  }
  const bodyH=`<div class="selesai-body" style="max-height:999px">${vc}${rows}</div>`;
  return`<div class="zone zone-selesai collapsed" style="margin-top:18px">
    <div class="zone-hdr" onclick="this.closest('.zone-selesai').classList.toggle('collapsed');this.closest('.zone-selesai').querySelector('.selesai-body').style.maxHeight=this.closest('.zone-selesai').classList.contains('collapsed')?'0':'999px'">
      <div class="zdot"></div><span class="zlbl">Selesai Minggu Ini</span><span class="zct">${done.length}</span><span class="chev">▼</span>
    </div>
    ${bodyH}
  </div>`;
}

// ── TICKER ────────────────────────────────────────────────────────
(function initTicker(){
  const tickerEl=document.getElementById('tickerTxt');
  if(!tickerEl||!QUOTES||!QUOTES.length) return;
  let idx=0;
  function showNext(){
    const next=QUOTES[(idx+1)%QUOTES.length];
    tickerEl.classList.remove('visible');
    tickerEl.classList.add('exit');
    setTimeout(()=>{
      tickerEl.textContent='“'+next.q+'” — '+next.a;
      tickerEl.classList.remove('exit');
      tickerEl.classList.add('enter');
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        tickerEl.classList.remove('enter');
        tickerEl.classList.add('visible');
      }));
      idx=(idx+1)%QUOTES.length;
    },650);
  }
  const firstQ=QUOTES[0];
  tickerEl.textContent='“'+firstQ.q+'” — '+firstQ.a;
  setInterval(showNext,8000);
})();
